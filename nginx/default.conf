# Принимаем HTTP-запросы на 80 порту от обоих вариантов домена
server {
    listen 80;
    server_name personal-movietracker.ru www.personal-movietracker.ru;

    # Путь, который Let's Encrypt будет дёргать для проверки владения доменом.
    # Файлы для проверки certbot кладёт в /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы — пересылаем в FastAPI-приложение.
    # "app" — имя сервиса в docker-compose.yml, Docker сам резолвит его в IP контейнера
    location / {
        proxy_pass http://app:8000;

        # Передаём приложению информацию о реальном клиенте,
        # иначе FastAPI будет видеть только IP nginx-контейнера
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
