# ===== HTTP (порт 80) =====
# Делаем две вещи:
#   1. Отдаём файлы для проверки Let's Encrypt (нужно для обновления сертификата)
#   2. Всё остальное — редирект на HTTPS
server {
    listen 80;
    server_name personal-movietracker.ru www.personal-movietracker.ru;

    # Этот путь оставляем доступным по http — иначе certbot не сможет
    # обновлять сертификат через webroot-проверку
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы перенаправляем на https (постоянный редирект 301)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== HTTPS (порт 443) =====
# Основной блок — здесь живёт сайт
server {
    listen 443 ssl;
    server_name personal-movietracker.ru www.personal-movietracker.ru;

    # Пути к сертификату и приватному ключу.
    # Это пути ВНУТРИ контейнера nginx — они смонтированы из ./certbot/conf на хосте
    ssl_certificate     /etc/letsencrypt/live/personal-movietracker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/personal-movietracker.ru/privkey.pem;

    # Современные настройки SSL — отключаем старые небезопасные версии TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Проксирование в FastAPI — всё то же самое, что было раньше
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
