services:

  # Сервис базы данных — PostgreSQL 16 на основе alpine (лёгкий образ)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}           # название базы данных
      POSTGRES_USER: ${POSTGRES_USER}       # пользователь БД
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # пароль пользователя
    volumes:
      # Данные БД хранятся в именованном volume, а не внутри контейнера.
      # Это значит данные сохранятся даже после docker compose down
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Проверяем готовность БД принимать подключения перед запуском приложения
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s   # проверять каждые 5 секунд
      timeout: 5s    # считать неудачей если нет ответа за 5 секунд
      retries: 5     # после 5 неудач — считать сервис нерабочим

  # Сервис приложения — собирается из Dockerfile в текущей папке
  app:
    build: .
    environment:
      # URL подключения к БД. "db" — это имя сервиса выше, Docker сам резолвит его в IP
      DATABASE_URL: ${DATABASE_URL}
    ports:
      # Пробрасываем порт: 8000 на Mac → 8000 внутри контейнера
      # После запуска приложение доступно на http://localhost:8000
      - "8000:8000"
    volumes:
      - ./back/:/app/back
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        # Приложение запустится только после того, как БД пройдёт healthcheck выше
        condition: service_healthy

  # Reverse proxy — принимает HTTP/HTTPS трафик снаружи и пересылает в app.
  # Без nginx сайт был бы доступен только на :8000, и не было бы HTTPS
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"     # http
      - "443:443"   # https (понадобится после получения сертификата)
    volumes:
      # Конфиг nginx подключаем как read-only — правки делаются на хосте
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Папки для Let's Encrypt: сертификаты и временные файлы для проверки домена.
      # Создадим их на сервере при настройке HTTPS
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

# Именованные volumes — Docker хранит их на диске независимо от контейнеров.
# Удалить вместе с данными можно командой: docker compose down -v
volumes:
  postgres_data:
